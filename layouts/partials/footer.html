{{- $profile := hugo.Data.profile -}}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <div>
      <p class="site-footer__name">{{ $profile.name }}</p>
      <p class="site-footer__note">{{ $profile.role }} · {{ $profile.location }}</p>
    </div>
    {{ partial "social.html" . }}
  </div>

  <div class="container site-footer__base">
    <p>© {{ now.Year }} {{ $profile.name }}</p>
    <a href="#top">Back to top {{ partial "icon.html" (dict "name" "arrow-up") }}</a>
  </div>
</footer>
